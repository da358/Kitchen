<!-- ══════════════════════════════════════════════════════════════════════════
     THE KITCHEN — ADMIN SESSION LEADERBOARD
     Leaderboard 260828.5 — .1–.3 built dev session 34; .4 added the licence
     notice in dev session 35; .5 filled in the licensing contact.
     260828.1 was the first build of this page in the same session; .2 replaced
     the automatic fit-to-screen with a three-way spacing control and added the
     Level 1 board on a toggle; .3 added the mid-round activity table. All at
     owner direction.

     WHAT THIS IS. A separate, standalone page for the facilitator to put on a
     shared screen. It is NOT part of the game and shares no code with it.
     Type a session code, and it shows that session's Level 2 and Level 3
     boards as stacked tables (Level 2 and Level 3 always, Level 1 on a
     toggle), live-updating, in big type meant to be read
     across a room.

     IT ONLY EVER READS. Deliberately, the Firebase import below brings in
     onValue and NOTHING that can write — no set, no update, no
     remove, no push. That is not just a promise in a comment: the functions
     are not in the file, so no future edit can write to the database by
     accident.

     IT READS TWO PATHS, and the second arrived in 260828.3.
     results/{sessionCode} is the leaderboard data. games/{gameCode} is a
     team's LIVE record, read only for the mid-round activity table, and only
     for team codes DISCOVERED IN THE RESULTS — because Firebase will not list
     games any more than it will list results. See MID-ROUND ACTIVITY in the
     script below for what that means and what it does not. Anything that needs to write (for instance a "clear this
     session's results" control) is a decision to take on purpose, with this
     comment in front of you.

     THE COST, RECORDED HERE ON PURPOSE (handoff §2, dev session 34):
     THE FIREBASE CONNECTION SETTINGS NOW LIVE IN TWO FILES — this one and
     the game. If the Firebase project ever changes, BOTH files change. The
     block is marked FIREBASE CONFIG below and is a byte-for-byte copy of the
     game's, including the pinned SDK version.

     WHY THE SDK VERSION IS PINNED AT 10.12.0 AND NOT THE LATEST (12.18 as of
     August 2026): it is the version the game runs. Two files reading the same
     database through two different library versions is one more thing that
     can behave differently in a room. Upgrading is its own job, and it should
     move both files together.

     WHY THERE IS NO DROPDOWN OF SESSION CODES. Firebase's rules grant read at
     results/{sessionCode}, and they cascade DOWN, never up. There is no rule
     on results itself, so asking Firebase for the LIST of session codes is
     refused outright — Firebase fails a read at a parent path even when every
     child under it is readable. That is deliberate ("you must know the code"),
     the same posture the game's own data has. So the code is typed, with
     one-tap buttons for the codes in use. See KNOWN_SESSION_CODES below for
     the one place to edit when a code is added, and THE DROPDOWN HOOK for
     what to do if the rules are ever opened up.
     ══════════════════════════════════════════════════════════════════════ -->

<style>
  /* ── DESIGN TOKENS ───────────────────────────────────────────────────────
     Copied from the game (copper & cream). Only the tokens this page uses
     are here; the names and values are the game's, so a row on this page and
     a row on the in-game board are the same colour by construction rather
     than by eye. */
  :root {
    --bg:          #FBF3E7;
    --surface:     #F3E4CC;
    --surface-2:   #D2B78D;
    --border:      #B8935C;
    --text:        #2B241C;
    --text-2:      #6B6252;
    --text-3:      #7A6F5A;
    --accent:      #B23A2E;
    --accept:      #2F6B4A;
    --danger:      #E23A2A;
    --radius:      8px;
    --radius-lg:   14px;
    --shadow:      0 1px 4px rgba(43,36,28,0.08);
    --font:        -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    --font-display:'Georgia', 'Times New Roman', serif;

    /* ── PROJECTION SIZING ────────────────────────────────────────────────
       The one real difference from the in-game card. In the game a board is
       read by one person on a laptop; here it is read across a room, so
       every size below is a step up from the game's. They are gathered in
       one place so the whole page can be scaled from four numbers rather
       than hunted through the rules. Browser zoom (Cmd/Ctrl and +) scales
       the lot again on the night if a room turns out bigger than expected. */
    /* clamp(smallest, scales-with-width, largest): the type grows on a big
       projector by itself, rather than relying on somebody remembering to
       press Cmd-+ in front of a room. The smallest values are what a 1024
       projector shows; the largest are for a 1920 screen. */
    --row-size:    clamp(24px, 1.8vw, 36px);   /* team name and rank — the game uses 14px */
    --time-size:   clamp(28px, 2.2vw, 44px);   /* the number people compare */
    --detail-size: clamp(15px, 1.0vw, 21px);   /* cooks · tickets · average — the game uses 12px */
    --note-size:   clamp(15px, 0.95vw, 20px);
    /* DENSITY. Owner direction, dev session 34 (second pass): three settings
       the facilitator chooses, rather than a page that measures itself and
       shrinks. The automatic fit was removed in the same change — with a
       density control beside it, two things decided the same question and
       neither was obviously in charge, and the owner is content to scroll the
       whole page.

       TWO SCALES, NOT ONE, and this is the point of the whole control:
       SPACE shrinks much faster than TYPE. Going from wide to tight takes the
       padding to a third but the type only to about three quarters, so a tight
       page fits far more rows while the numbers are still readable across a
       room. One scale would have shrunk both together and hit unreadable type
       long before it fit a 15-team room.

       --pad  scales padding, margins and gaps
       --type scales every font size
       Set together by setDensity(); MEDIUM is the opening default. */
    --pad:         0.62;
    --type:        0.85;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: calc(28px * var(--pad)) 28px calc(20px * var(--pad));
  }

  /* ── HEADER AND CONTROLS ─────────────────────────────────────────────── */
  .top {
    max-width: 1500px; margin: 0 auto calc(24px * var(--pad));
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; flex-wrap: wrap;
  }
  .wordmark h1 {
    font-family: var(--font-display);
    font-size: calc(40px * var(--type)); font-weight: normal; letter-spacing: -0.5px;
    line-height: 1; color: var(--text);
  }
  .wordmark p {
    margin-top: 6px; color: var(--text-2);
    font-size: 15px; letter-spacing: 0.04em;
  }
  .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .code-entry { display: flex; gap: 8px; align-items: center; }
  #code-input {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 14px; font-size: 17px; font-family: var(--font);
    background: var(--bg); color: var(--text); outline: none;
    width: 200px; letter-spacing: 0.06em; text-transform: uppercase;
    transition: border-color 0.15s;
  }
  #code-input:focus { border-color: var(--accent); }
  #code-input::placeholder { color: var(--text-3); letter-spacing: 0.02em; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 18px; border-radius: var(--radius); border: none;
    cursor: pointer; font-size: 14px; font-weight: 600; font-family: var(--font);
    letter-spacing: 0.01em; transition: opacity 0.15s, transform 0.1s;
  }
  .btn:hover { opacity: 0.88; }
  .btn:active { transform: scale(0.98); }
  .btn-primary   { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-quick {
    background: none; border: 1px solid var(--border); color: var(--text-2);
    padding: 8px 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.05em;
    border-radius: var(--radius); cursor: pointer; font-family: var(--font);
  }
  .btn-quick:hover { border-color: var(--accent); color: var(--accent); }
  .quick-picks { display: flex; gap: 8px; align-items: center; }
  .quick-picks span {
    font-size: 12px; color: var(--text-3); letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  /* The filter. Default ON, because the common case is a screen the whole
     room is looking at, and a room comparing times should be comparing
     completions. Turned OFF it becomes a monitoring view: see lbRender(). */
  .filter-row {
    max-width: 1500px; margin: 0 auto calc(20px * var(--pad));
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
    padding: 12px 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .filter-row label {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 15px; color: var(--text); cursor: pointer; user-select: none;
  }
  .filter-row input[type="checkbox"] {
    width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer;
  }
  .filter-hint { font-size: 13px; color: var(--text-3); }
  .density { display: inline-flex; align-items: center; gap: 6px; }
  .density-label {
    font-size: 12px; color: var(--text-3); letter-spacing: 0.06em;
    text-transform: uppercase; margin-right: 2px;
  }
  .btn-density {
    background: none; border: 1px solid var(--border); color: var(--text-2);
    padding: 6px 12px; font-size: 13px; font-weight: 600; font-family: var(--font);
    border-radius: var(--radius); cursor: pointer;
  }
  .btn-density:hover { border-color: var(--accent); color: var(--accent); }
  /* The chosen one is filled, not merely outlined: at a glance from a lectern,
     an outline-versus-outline difference is not readable. */
  .btn-density.is-on {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  /* The liveness line. On a screen left up for an hour, the question is
     never "what does it say" but "is it still connected". */
  .status { font-size: 13.5px; color: var(--text-3); letter-spacing: 0.02em; }
  .status .dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: var(--accept); margin-right: 7px; vertical-align: baseline;
  }
  .status.is-stale .dot { background: var(--surface-2); }
  .status.is-error { color: var(--danger); }
  .status.is-error .dot { background: var(--danger); }

  /* ── THE BOARDS ──────────────────────────────────────────────────────── */
  .boards { max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column;
            gap: calc(24px * var(--pad)); }
  /* STACKED IS THE DEFAULT — owner direction, dev session 34.
     MEASURED THE SAME SESSION, which is why the side-by-side option exists at
     all: stacked, on a 1920x1080 screen, only FIVE teams per level fit before
     the type hits its readability floor. A 10-15 team room does not fit
     stacked, and the owner's rooms are 10-15 teams. Two columns puts the two
     boards beside each other and roughly doubles what fits. Kept as a control
     rather than as automatic behaviour, because which one reads better across
     a particular room is the facilitator's judgement, not this file's. */
  .boards.side-by-side { flex-direction: row; max-width: 1900px; align-items: flex-start; }
  .boards.side-by-side .board-card { flex: 1 1 0; min-width: 0; }
  /* Stacked, not side by side — owner direction, dev session 34. */
  .board-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: calc(24px * var(--pad)) 28px; box-shadow: var(--shadow);
  }
  .board-card h2 {
    font-family: var(--font-display); font-weight: normal;
    font-size: calc(28px * var(--type)); color: var(--text); line-height: 1.1;
  }
  .board-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: calc(18px * var(--pad));
  }
  .board-count { font-size: calc(var(--note-size) * var(--type)); color: var(--text-2); }

  /* A header row, which the in-game card deliberately does not have. There,
     one person reads four numbers about their own team on a page they have
     been on for an hour. Here a roomful of people who have never seen the
     page have to know what the right-hand number is. */
  .lb-head {
    display: flex; align-items: baseline; gap: 16px;
    padding-bottom: 8px; border-bottom: 2px solid var(--border);
    font-size: 12px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-3);
  }
  /* The header cells must NOT inherit the big row sizes. Found in a
     screenshot, dev session 34: "TIME" rendered at 30px uppercase and pulled
     more attention than the times it labels. */
  .lb-head .lb-time, .lb-head .lb-tickets { font-size: 12px; font-weight: 700; }
  .lb-head .lb-rank { color: var(--text-3); font-weight: 700; }
  .lb-row {
    display: flex; align-items: baseline; gap: 16px;
    padding: calc(14px * var(--pad)) 0; border-bottom: 1px solid var(--border);
    font-size: calc(var(--row-size) * var(--type));
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank {
    flex: 0 0 auto; min-width: 46px;
    font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums;
  }
  .lb-name { flex: 1 1 auto; overflow-wrap: anywhere; }
  .lb-tickets {
    flex: 0 0 auto; font-size: calc(var(--detail-size) * var(--type)); color: var(--text-3);
    text-align: right;
  }
  .lb-time {
    flex: 0 0 auto; font-weight: 600; font-size: calc(var(--time-size) * var(--type));
    font-variant-numeric: tabular-nums; min-width: 110px; text-align: right;
  }
  /* NO "(you)" ROW TINT ON THIS PAGE — owner direction, dev session 34.
     There is no "you" here: nobody's team owns this screen. The in-game
     board's .lb-me tint exists to find your own row in a list of strangers,
     which is a job this page does not have. */

  /* Rounds the host stopped early. Shown only when the filter is off, and
     kept visually quieter than the ranked rows above — the same "this is an
     aside" language the game uses for its unranked line, and for the same
     reason: an early end is a fact about a round, not a verdict on a team. */
  .lb-early {
    margin-top: 22px; padding: 16px 0 2px 16px;
    border-left: 3px solid var(--border);
  }
  .lb-early h3 {
    font-size: 12px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: 10px;
  }
  .lb-early .lb-row {
    font-size: calc(var(--row-size) - 4px); color: var(--text-2);
    padding: 10px 0; border-bottom: 1px dotted var(--border);
  }
  .lb-early .lb-row .lb-time { font-size: calc(var(--time-size) - 8px); font-weight: 500; }
  .lb-early .lb-rank { color: var(--text-3); font-weight: 500; }
  /* A running clock is a different KIND of number from a finished time, and
     on a projected screen the difference has to be visible at a glance rather
     than by reading the "+". Copper, the palette's emphasis colour, is what
     the rank numbers already use. */
  .lb-time.is-running { color: var(--accent); }
  /* The qualifying WORD is not the number. Set at full size, "3:15 paused"
     read as loudly as a running clock and crowded the column; half size keeps
     the number scannable and the word legible. Found in a screenshot. */
  .lb-time .qual { font-size: 0.52em; letter-spacing: 0.03em; margin-left: 0.35em; }
  .lb-time.is-lobby .qual { margin-left: 0; }
  .lb-time.is-paused  { color: var(--text-3); font-weight: 500; }
  .lb-note { margin-top: calc(16px * var(--pad)); font-size: calc(var(--note-size) * var(--type));
             color: var(--text-3); line-height: 1.45; }
  .lb-empty { font-size: 20px; color: var(--text-2); padding: 8px 0; }

  #version-line {
    max-width: 1500px; margin: calc(20px * var(--pad)) auto 0;
    font-size: 11px; color: var(--text-3); letter-spacing: 0.06em;
  }

  /* One narrow-screen rule, so the page is still usable on a laptop while
     setting up. It is not a phone page and does not pretend to be. */
  @media (max-width: 900px) {
    :root { --row-size: 20px; --time-size: 24px; --detail-size: 15px; --note-size: 15px; }
    body { padding: 18px 16px 36px; }
    .lb-tickets { display: none; }   /* the two numbers that matter survive */
    /* Never two columns on a narrow screen, whatever the checkbox says. */
    .boards.side-by-side { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="top">
  <div class="wordmark">
    <h1>The Kitchen</h1>
    <p>Session leaderboard — facilitator view</p>
  </div>
  <div class="controls">
    <div class="code-entry">
      <input id="code-input" type="text" placeholder="Session code" maxlength="24"
             autocomplete="off" spellcheck="false" aria-label="Session code">
      <button class="btn btn-primary" id="btn-show">Show</button>
      <button class="btn btn-secondary" id="btn-refresh" title="Re-read the session now. The page updates by itself; this is here for peace of mind.">Refresh</button>
    </div>
    <div class="quick-picks">
      <span>Known</span>
      <span id="quick-picks-list"></span>
    </div>
  </div>
</div>

<div class="filter-row">
  <label>
    <input type="checkbox" id="only-completed" checked>
    Show only completed rounds
  </label>
  <label>
    <input type="checkbox" id="show-level1">
    Show Level 1
  </label>
  <label>
    <input type="checkbox" id="show-midround">
    Show mid-round activity
  </label>
  <label>
    <input type="checkbox" id="side-by-side">
    Side by side
  </label>
  <span class="density">
    <span class="density-label">Spacing</span>
    <button type="button" class="btn-density" data-density="wide">Wide</button>
    <button type="button" class="btn-density" data-density="medium">Medium</button>
    <button type="button" class="btn-density" data-density="tight">Tight</button>
  </span>
  <span class="filter-hint" id="filter-hint"></span>
  <span class="status" id="status"><span class="dot"></span><span id="status-text">Enter a session code to begin.</span></span>
</div>

<div class="boards">
  <!-- Hidden unless Show mid-round activity is ticked. Sits ABOVE the boards
       because it answers a different question from them: not who did well, but
       who is still going. -->
  <div class="board-card" id="board-midround" style="display:none;">
    <div class="board-head">
      <h2>In progress now</h2>
      <span class="board-count" id="count-midround"></span>
    </div>
    <div id="body-midround"></div>
  </div>
  <!-- Hidden unless the Show Level 1 box is ticked. Owner direction: useful
       while monitoring, not meaningful to a room being shown results, because
       Level 1 has no clock and therefore no time to compare. -->
  <div class="board-card" id="board-level1" style="display:none;">
    <div class="board-head">
      <h2>Level 1 — Onboarding</h2>
      <span class="board-count" id="count-level1"></span>
    </div>
    <div id="body-level1"></div>
  </div>
  <div class="board-card" id="board-level2">
    <div class="board-head">
      <h2>Level 2 — Core game</h2>
      <span class="board-count" id="count-level2"></span>
    </div>
    <div id="body-level2"></div>
  </div>
  <div class="board-card" id="board-level3">
    <div class="board-head">
      <h2>Level 3 — Task trading</h2>
      <span class="board-count" id="count-level3"></span>
    </div>
    <div id="body-level3"></div>
  </div>
</div>

<p id="version-line">Leaderboard 260828.5 &nbsp;·&nbsp; reads only &nbsp;·&nbsp; © Set Forth LLC</p>

<script type="module">
import { initializeApp }                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue }               from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
/* READ-ONLY BY CONSTRUCTION. set, update, remove, push and runTransaction are
   deliberately absent from that import — see the header comment. */

/* ─── FIREBASE CONFIG ──────────────────────────────────────────────────────
   A COPY OF THE GAME'S. If the Firebase project ever changes, this block and
   the game's must change together. This is the cost recorded in the header. */
const firebaseConfig = {
  apiKey: "AIzaSyB5AhrFrBnKc7OzcKo82j7qyKFBWGxmdS0",
  authDomain: "kitchen-5cb9a.firebaseapp.com",
  databaseURL: "https://kitchen-5cb9a-default-rtdb.firebaseio.com",
  projectId: "kitchen-5cb9a",
  storageBucket: "kitchen-5cb9a.firebasestorage.app",
  messagingSenderId: "297004284280",
  appId: "1:297004284280:web:095912fd748d7dcccb308d"
};

/* THE ONE PLACE TO EDIT WHEN A SESSION CODE IS ADDED. These become the
   one-tap buttons beside the input box, so nobody types at a live event.
   Any code can still be typed in full — this list is a convenience, never a
   restriction, which is the difference between this page and the game's
   validSessionCodes (that one is a gate; this one is a shortcut).
   Keep it in step with the game's validSessionCodes when a code is added. */
const KNOWN_SESSION_CODES = ["337CHARLIE", "ADHOC"];

/* THE DROPDOWN HOOK. If the Firebase rules are ever changed to allow reading
   at results itself (a one-line change: "results": { ".read": true, ... }),
   a real dropdown of every session code becomes possible — and note what
   that change actually opens, which is more than the list of codes: read at
   results cascades DOWN to every record of every session. Until that
   decision is taken on purpose, this page does not attempt the read at all.
   Attempting it would only put a permission error in the browser log on
   every load, and the owner already knows the answer.
   To build the dropdown later: read results with onValue, take
   Object.keys(snapshot.val()), sort them, and populate a <select> that sets
   the same value the input box sets. Nothing else on this page changes. */

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

/* ─── STATE ──────────────────────────────────────────────────────────────── */
let unsub     = null;    // the live listener, or null
let unsubPath = null;    // the path it is attached to, so it can be detached
let currentRecords = {}; // the last snapshot, kept so the filter can redraw
                         // without re-reading Firebase
let currentCode = "";

const el = id => document.getElementById(id);

/* ─── SMALL SHARED HELPERS — the same arithmetic as the game's board ─────── */

/* M:SS from seconds. The stored record holds seconds, so this takes seconds.
   Same shape as the game's lbMMSS(). */
function mmss(sec) {
  const s = Math.max(0, Math.round(Number(sec) || 0));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

/* Average time per ticket. DERIVED HERE, NEVER STORED — the same rule as the
   game, and for the same reason: a stored average can end up disagreeing
   with the two numbers printed beside it on the same row.
   Returns null rather than zero when there are no tickets, so the caller
   leaves the words out instead of printing "0:00 each", which would read as
   a team that finished instantly. */
function avgPerTicket(rec) {
  const t = Number(rec && rec.tickets) || 0;
  const s = Number(rec && rec.totalSec);
  if (!t || !isFinite(s) || s <= 0) return null;
  return s / t;
}

/* The detail column: cooks first, then tickets, then the average.
   COOKS COMES FROM THE STORED ROLES MAP, never from team size minus one
   Observer — whether a level has an Observer may become a per-session
   choice, and a record written under a different rule would then be
   misread. A record written before 260828.2 has no roles map, and a missing
   count prints nothing rather than "0 cooks". */
function detailLine(r) {
  const cooks = Number(r.roles && r.roles.cooks) || 0;
  const avg   = avgPerTicket(r);
  return (cooks ? `${cooks} cook${cooks === 1 ? "" : "s"} · ` : "")
       + `${r.tickets || 0} tickets`
       + (avg === null ? "" : ` · ${mmss(avg)} each`);
}

/* Text nodes, never innerHTML. A team name is typed by a player, and this
   page is projected in front of a room; the game's own panel renderer takes
   the same line (see "Bold in message copy"). */
function rowEl(rankText, name, detail, timeText, cls) {
  const row = document.createElement("div");
  row.className = "lb-row" + (cls ? " " + cls : "");
  const a = document.createElement("span"); a.className = "lb-rank";    a.textContent = rankText;
  const b = document.createElement("span"); b.className = "lb-name";    b.textContent = name;
  const c = document.createElement("span"); c.className = "lb-tickets"; c.textContent = detail;
  const d = document.createElement("span"); d.className = "lb-time";    d.textContent = timeText;
  row.append(a, b, c, d);
  return row;
}

function headEl() {
  const h = document.createElement("div");
  h.className = "lb-head";
  [["lb-rank", "#"], ["lb-name", "Team"], ["lb-tickets", "Cooks · tickets · average"], ["lb-time", "Time"]]
    .forEach(([cls, text]) => {
      const s = document.createElement("span"); s.className = cls; s.textContent = text;
      h.appendChild(s);
    });
  return h;
}

/* ─── DRAWING A BOARD ────────────────────────────────────────────────────── */
/* THE RANKING RULES ARE THE GAME'S, DELIBERATELY IDENTICAL:
   only completions are ranked; one row per TEAM at its best time, keyed on
   the team code rather than the name because two teams in a session may pick
   the same name; ties broken by who finished first; rank and the team count
   derived here and never stored. If this page and the in-game board ever
   disagreed in front of a room, the page would be worthless. */
function renderBoard(levelType, records, onlyCompleted) {
  const body  = el(`body-${levelType}`);
  const count = el(`count-${levelType}`);
  body.textContent = "";
  count.textContent = "";

  const all = Object.values(records || {}).filter(r => r && r.level === levelType);

  /* A completion needs a real time. Level 1 records carry no totalSec at all
     (Level 1 runs with no clock, and Firebase does not store nulls), and a
     Level 2 or 3 round could in principle lack one too. A missing time is
     never a bug — it just cannot be ranked. */
  const completions = all.filter(r => r.endReason === "completed" && typeof r.totalSec === "number");
  const bestByTeam = {};
  for (const r of completions) {
    const key = r.gameCode || r.teamName || Math.random().toString(36);
    if (!bestByTeam[key] || r.totalSec < bestByTeam[key].totalSec) bestByTeam[key] = r;
  }
  const ranked = Object.values(bestByTeam).sort((a, b) =>
    (a.totalSec - b.totalSec) || ((a.finishedAt || 0) - (b.finishedAt || 0)));

  /* Rounds the host stopped early — one line per team, its most recent, so a
     team that stopped twice does not read as two teams. */
  const earlyByTeam = {};
  for (const r of all) {
    if (r.endReason === "completed") continue;
    const key = r.gameCode || r.teamName || Math.random().toString(36);
    if (!earlyByTeam[key] || (r.finishedAt || 0) > (earlyByTeam[key].finishedAt || 0)) earlyByTeam[key] = r;
  }
  const early = Object.values(earlyByTeam).sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));

  /* Counted from the records themselves, never configured in advance — the
     owner often will not know the team count until the room is grouped. */
  const teamsSeen = new Set(all.map(r => r.gameCode || r.teamName)).size;

  if (!all.length) {
    const p = document.createElement("p");
    p.className = "lb-empty";
    p.textContent = currentCode
      ? "No team has played this level yet."
      : "Enter a session code above.";
    body.appendChild(p);
    return;
  }

  count.textContent = `${teamsSeen} team${teamsSeen === 1 ? "" : "s"} played · `
                    + `${ranked.length} completed`;

  if (ranked.length) {
    body.appendChild(headEl());
    ranked.forEach((r, i) => {
      body.appendChild(rowEl(
        String(i + 1),
        r.teamName || r.gameCode || "A team",
        detailLine(r),
        mmss(r.totalSec)
      ));
    });
  } else {
    const p = document.createElement("p");
    p.className = "lb-empty";
    p.textContent = "No team has completed this level yet.";
    body.appendChild(p);
  }

  /* The filter. Owner direction, dev session 34: on for a screen the room is
     looking at, off for monitoring a session as it runs. */
  if (!onlyCompleted && early.length) {
    const box = document.createElement("div");
    box.className = "lb-early";
    const h = document.createElement("h3");
    h.textContent = `Ended early — not ranked (${early.length})`;
    box.appendChild(h);
    early.forEach(r => {
      box.appendChild(rowEl(
        "—",
        r.teamName || r.gameCode || "A team",
        detailLine(r),
        (typeof r.totalSec === "number") ? mmss(r.totalSec) : "no time"
      ));
    });
    body.appendChild(box);
  }

  const note = document.createElement("p");
  note.className = "lb-note";
  if (onlyCompleted && early.length) {
    const one = early.length === 1;
    note.textContent = `${early.length} round${one ? "" : "s"} ended early and `
                     + `${one ? "is" : "are"} not shown. Untick the box above to see `
                     + `${one ? "it" : "them"}.`;
  } else {
    note.textContent = "Updates by itself as teams finish.";
  }
  body.appendChild(note);
}

/* ─── DENSITY ────────────────────────────────────────────────────────────
   Replaced the automatic fit-to-screen, dev session 34 (second pass), at
   owner direction. The page no longer measures itself or shrinks: the
   facilitator picks a spacing and the page scrolls if it is long.

   MEASURED at 1920x1080 with 14 teams on each of Levels 2 and 3, stacked —
   these are the numbers the choice is really between:
     wide    two boards ≈ 3200px, so about a third of one board on screen
     medium  two boards ≈ 2000px
     tight   two boards ≈ 1450px, and with side-by-side on, both fit at once
   None of them fits a 15-team room stacked, which is expected and fine: the
   owner scrolls one page rather than two scrolling tables. */
const DENSITIES = {
  wide:   { pad: 1,    type: 1    },
  medium: { pad: 0.62, type: 0.85 },
  tight:  { pad: 0.32, type: 0.72 }
};
const DEFAULT_DENSITY = "medium";   // owner's choice, dev session 34
let currentDensity = DEFAULT_DENSITY;

function setDensity(name) {
  const d = DENSITIES[name] || DENSITIES[DEFAULT_DENSITY];
  currentDensity = DENSITIES[name] ? name : DEFAULT_DENSITY;
  document.documentElement.style.setProperty("--pad", String(d.pad));
  document.documentElement.style.setProperty("--type", String(d.type));
  document.querySelectorAll(".btn-density").forEach(b =>
    b.classList.toggle("is-on", b.dataset.density === currentDensity));
}

/* ─── THE LEVEL 1 BOARD ──────────────────────────────────────────────────
   A DIFFERENT TABLE, not the same one with a column blanked out, and the
   reason is in the data: LEVEL 1 RUNS WITH NO CLOCK, so its records carry no
   totalSec at all. There is no duration to show and none to rank by, and a
   rank column here would be inventing a competition that did not happen.

   What it shows instead, owner direction: the ORDER teams finished and the
   TIME OF DAY each finished — which between them answer the question this
   board is for, "is everybody through Level 1 yet, and how spread out are
   they". Hidden by default: it is a monitoring view, not something to show a
   room.

   Recorded for a future session: a real Level 1 duration needs the game to
   stamp the round start for Level 1, which this file cannot do. */
function clockFromRecord(r) {
  /* finishedAtET is written by the host as "2026-08-28 14:13:20 EDT". Take
     the hour and minute out of it rather than re-deriving from finishedAt,
     so this page and the Firebase console agree. Falls back to the numeric
     stamp when the string is missing (records written before 260828.3). */
  const m = /\b(\d{2}):(\d{2}):\d{2}\b/.exec(String(r && r.finishedAtET || ""));
  if (m) {
    let h = Number(m[1]);
    const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    return `${h}:${m[2]} ${ampm}`;
  }
  if (typeof r.finishedAt === "number") {
    try {
      return new Intl.DateTimeFormat("en-US",
        { hour: "numeric", minute: "2-digit" }).format(new Date(r.finishedAt));
    } catch (e) { /* fall through */ }
  }
  return "—";
}

function renderLevel1(records, onlyCompleted) {
  const body  = el("body-level1");
  const count = el("count-level1");
  body.textContent = "";
  count.textContent = "";

  const all = Object.values(records || {}).filter(r => r && r.level === "level1");
  if (!all.length) {
    const p = document.createElement("p");
    p.className = "lb-empty";
    p.textContent = currentCode ? "No team has finished Level 1 yet."
                                : "Enter a session code above.";
    body.appendChild(p);
    return;
  }

  /* One line per team, its most recent Level 1 round. Earliest finisher
     first, because that is the order the room actually moved in. */
  const byTeam = {};
  for (const r of all) {
    if (onlyCompleted && r.endReason !== "completed") continue;
    const key = r.gameCode || r.teamName || Math.random().toString(36);
    if (!byTeam[key] || (r.finishedAt || 0) > (byTeam[key].finishedAt || 0)) byTeam[key] = r;
  }
  const done = Object.values(byTeam).sort((a, b) => (a.finishedAt || 0) - (b.finishedAt || 0));
  const teamsSeen = new Set(all.map(r => r.gameCode || r.teamName)).size;
  count.textContent = `${teamsSeen} team${teamsSeen === 1 ? "" : "s"} through Level 1`;

  if (!done.length) {
    const p = document.createElement("p");
    p.className = "lb-empty";
    p.textContent = "No team has completed Level 1 yet.";
    body.appendChild(p);
    return;
  }

  /* Its own header, because the last column is a clock time, not a duration,
     and a room reading "TIME" would take it for one. */
  const h = document.createElement("div");
  h.className = "lb-head";
  [["lb-rank", "#"], ["lb-name", "Team"], ["lb-tickets", "Cooks · tickets"],
   ["lb-time", "Finished"]].forEach(([cls, text]) => {
    const sp = document.createElement("span"); sp.className = cls; sp.textContent = text;
    h.appendChild(sp);
  });
  body.appendChild(h);

  done.forEach((r, i) => {
    const cooks = Number(r.roles && r.roles.cooks) || 0;
    const detail = (cooks ? `${cooks} cook${cooks === 1 ? "" : "s"} · ` : "")
                 + `${r.tickets || 0} tickets`
                 + (r.endReason === "completed" ? "" : " · ended early");
    body.appendChild(rowEl(String(i + 1), r.teamName || r.gameCode || "A team",
                           detail, clockFromRecord(r)));
  });

  const note = document.createElement("p");
  note.className = "lb-note";
  note.textContent = "Level 1 runs without a clock, so there is no time to rank — "
                   + "this is the order teams finished and when.";
  body.appendChild(note);
}

/* ─── MID-ROUND ACTIVITY (260828.3) ──────────────────────────────────────
   Owner request: see which teams are still in which level while a session is
   running, so a room can be nudged rather than guessed at.

   THE HARD CONSTRAINT, AND IT SHAPES EVERYTHING BELOW. This page cannot ask
   Firebase which teams are playing. Listing `games` is refused for exactly
   the reason listing `results` is refused: the rule grants read at
   games/$gameCode, rules cascade DOWN only, and there is no rule on `games`
   itself. A team's live record can be read ONLY IF ITS CODE IS ALREADY KNOWN.

   WHERE THE CODES COME FROM: the results we are already reading. Every result
   record carries its gameCode, so a team becomes visible here the moment it
   FINISHES ITS FIRST ROUND — and since every team starts at Level 1, anyone in
   Level 2 or Level 3 is discoverable.

   WHAT IS THEREFORE INVISIBLE, and it must never be presented as an empty
   room: a team still in Level 1, or still in its first lobby, has written no
   result yet and cannot be seen at all. The note under the table says so in
   words, because a facilitator reading "3 teams in progress" during a
   fifteen-team session would otherwise draw the wrong conclusion. The Level 1
   board's count is how you tell: teams you have, minus teams through Level 1.

   ONE LISTENER PER TEAM. Fifteen teams is fifteen listeners, which is
   unremarkable, and each is torn down when the toggle goes off or the session
   changes. */
const MIDROUND_STATUSES = ["playing", "paused", "lobby"];
let mrUnsubs = {};        // gameCode -> unsubscribe function
let mrRecords = {};       // gameCode -> that team's live record
let mrTicker = null;      // the clock that re-draws running times

function mrDetachAll() {
  Object.values(mrUnsubs).forEach(fn => { try { fn(); } catch (e) {} });
  mrUnsubs = {};
  mrRecords = {};
  if (mrTicker) { clearInterval(mrTicker); mrTicker = null; }
}

/* Called whenever the results change, because a team that just finished a
   round is a team whose code we may not have had a moment ago. */
function mrSync() {
  if (!el("show-midround").checked) { mrDetachAll(); return; }
  const codes = new Set(Object.values(currentRecords || {})
    .map(r => r && r.gameCode).filter(Boolean));
  codes.forEach(code => {
    if (mrUnsubs[code]) return;
    mrUnsubs[code] = onValue(ref(db, `games/${code}`), snap => {
      mrRecords[code] = snap.exists() ? snap.val() : null;
      renderMidround();
    }, err => {
      /* A team record we cannot read is not an error worth shouting about —
         it is one row missing from a monitoring table. Recorded and skipped. */
      mrRecords[code] = null;
      renderMidround();
    });
  });
  if (!mrTicker) {
    /* The only interval on this page. Running times are shown in 15-second
       steps, so five seconds is comfortably often enough to keep them honest
       without redrawing the table constantly. */
    mrTicker = setInterval(renderMidround, 5000);
  }
}

/* "5:15+" — floored to a 15-second step, with the + meaning "and counting".
   OWNER'S OWN FORMAT, dev session 34. Deliberately not a live-ticking second
   count: a projected table of numbers all changing every second is noise, and
   the question this answers is "roughly how long have they been at it", not
   "what is the exact time". Pause-correct for free, because the game shifts
   startTime forward on resume — a huddle does not inflate this. */
function mrRunningTime(rec) {
  if (!rec || !rec.startTime) return null;
  const stopped = rec.status === "paused" && rec.pausedAt ? rec.pausedAt : Date.now();
  const sec = Math.max(0, Math.floor((stopped - rec.startTime) / 1000));
  const stepped = Math.floor(sec / 15) * 15;
  return mmss(stepped);
}

function renderMidround() {
  const body  = el("body-midround");
  const count = el("count-midround");
  if (!el("show-midround").checked) return;
  body.textContent = "";
  count.textContent = "";

  /* Only this session's teams. A live record carries its own sessionCode
     (260827.8), so a code left over in an older result cannot drag another
     session's team onto this table. Records written before that build carry
     none, and missing is allowed rather than excluded — the code came out of
     this session's results in the first place. */
  const live = Object.entries(mrRecords)
    .filter(([, r]) => r && MIDROUND_STATUSES.includes(r.status))
    .filter(([, r]) => !r.sessionCode || r.sessionCode === currentCode)
    .map(([code, r]) => ({ code, r }));

  const LEVEL_LABEL = { level1: "Level 1", level2: "Level 2", level3: "Level 3" };
  const LEVEL_ORDER = { level3: 0, level2: 1, level1: 2 };

  /* Longest-running first within a level, because the team that has been at it
     longest is the one a facilitator may need to do something about. */
  live.sort((a, b) => {
    const la = a.r.status === "lobby" ? (a.r.pendingLevelType || a.r.levelType) : a.r.levelType;
    const lb = b.r.status === "lobby" ? (b.r.pendingLevelType || b.r.levelType) : b.r.levelType;
    const d = (LEVEL_ORDER[la] ?? 9) - (LEVEL_ORDER[lb] ?? 9);
    if (d) return d;
    return (a.r.startTime || Infinity) - (b.r.startTime || Infinity);
  });

  if (!live.length) {
    const p = document.createElement("p");
    p.className = "lb-empty";
    p.textContent = currentCode
      ? "No team that has finished a round is mid-round right now."
      : "Enter a session code above.";
    body.appendChild(p);
  } else {
    count.textContent = `${live.length} team${live.length === 1 ? "" : "s"} in progress`;

    const h = document.createElement("div");
    h.className = "lb-head";
    [["lb-rank", "Level"], ["lb-name", "Team"],
     ["lb-tickets", "Cooks · tickets so far"], ["lb-time", "Running"]]
      .forEach(([cls, text]) => {
        const sp = document.createElement("span"); sp.className = cls; sp.textContent = text;
        h.appendChild(sp);
      });
    body.appendChild(h);

    live.forEach(({ code, r }) => {
      const inLobby = r.status === "lobby";
      const levelKey = inLobby ? (r.pendingLevelType || r.levelType) : r.levelType;
      const players = r.players || {};
      /* Cooks is computed from the LIVE record here, not read from a stored
         roles map, because a round in progress has not written one yet. This
         is the one place the count is derived, and it is derived under the
         rule in force right now, which is the correct rule for a round
         happening right now. */
      const cooks = Object.keys(players)
        .filter(pid => pid !== (r.observerPlayerId || null)).length;
      const tickets = Object.values(players)
        .reduce((sum, pl) => sum + (Number(pl && pl.tasksCompleted) || 0), 0);
      const target = Number(r.taskTarget) || 0;

      const detail = `${cooks} cook${cooks === 1 ? "" : "s"} · `
                   + `${tickets} ticket${tickets === 1 ? "" : "s"}`
                   + (target ? ` of ${target}` : "");

      /* The number and the word are separate, so the word can be set smaller:
         see .lb-time .qual. A running round is the number plus "+", a paused
         one is the number it stopped at plus the word, a lobby is the word
         alone. */
      const running = mrRunningTime(r);
      let num = "", qual = "", cls = "";
      if (inLobby)                    { qual = "in lobby"; cls = "is-paused is-lobby"; }
      else if (r.status === "paused") { num = running || ""; qual = "paused"; cls = "is-paused"; }
      else                            { num = running ? `${running}+` : ""; qual = running ? "" : "starting";
                                        cls = "is-running"; }

      const row = rowEl(LEVEL_LABEL[levelKey] || "—",
                        r.teamName || code || "A team", detail, num);
      const timeCell = row.querySelector(".lb-time");
      cls.split(" ").forEach(c => c && timeCell.classList.add(c));
      if (qual) {
        const q = document.createElement("span");
        q.className = "qual";
        q.textContent = qual;
        timeCell.appendChild(q);
      }
      body.appendChild(row);
    });
  }

  /* THE HONEST LIMIT, in words, every time. See the block comment above. */
  const note = document.createElement("p");
  note.className = "lb-note";
  note.textContent = "Only teams that have finished at least one round appear here — "
                   + "a team still in Level 1 cannot be seen yet. "
                   + "Times count up in 15-second steps and exclude pauses.";
  body.appendChild(note);
}

function renderAll() {
  const onlyCompleted = el("only-completed").checked;
  const showLevel1    = el("show-level1").checked;
  const showMidround  = el("show-midround").checked;
  el("board-level1").style.display = showLevel1 ? "" : "none";
  el("board-midround").style.display = showMidround ? "" : "none";
  if (showLevel1) renderLevel1(currentRecords, onlyCompleted);
  /* mrSync() picks up team codes from the results that have just been drawn,
     so it runs after them, not before. */
  mrSync();
  if (showMidround) renderMidround();
  renderBoard("level2", currentRecords, onlyCompleted);
  renderBoard("level3", currentRecords, onlyCompleted);
  el("filter-hint").textContent = onlyCompleted
    ? "Showing completions only — the view for the room."
    : "Also showing rounds that ended early — the monitoring view.";
}

/* ─── STATUS LINE ────────────────────────────────────────────────────────── */
function setStatus(text, kind) {
  const s = el("status");
  s.className = "status" + (kind ? " is-" + kind : "");
  el("status-text").textContent = text;
}

function clockNow() {
  try {
    return new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "2-digit", second: "2-digit" })
      .format(new Date());
  } catch (e) {
    return new Date().toTimeString().slice(0, 8);
  }
}

/* ─── ATTACHING TO A SESSION ─────────────────────────────────────────────── */
/* DETACHING BY CALLING THE FUNCTION onValue GAVE BACK, not by calling off().
   This matters and it cost a harness failure to find. onValue() returns an
   unsubscribe FUNCTION; off() expects THE CALLBACK YOU REGISTERED. Handing
   the unsubscribe function to off() as if it were the callback matches
   nothing, so nothing is removed and the old listener keeps firing. Firebase's
   own documentation says to invoke the returned function.

   NOTE FOR THE GAME, dev session 34: lbDetach() in the game file does exactly
   the mismatched thing. Reported to the owner rather than fixed here — this
   page must not carry a change to the game. */
function detach() {
  if (unsub) {
    try { unsub(); } catch (e) { /* already gone */ }
  }
  unsub = null;
  unsubPath = null;
  /* The per-team listeners belong to the session too. Left attached across a
     session change they would keep reporting the previous session's teams into
     a table headed by the new code. */
  mrDetachAll();
}

/* Firebase keys cannot contain . $ # [ ] or / — a code with one of those in
   it would throw from ref() rather than simply finding nothing, so it is
   refused here with a sentence instead. */
function codeProblem(code) {
  if (!code) return "Enter a session code.";
  if (/[.$#[\]/]/.test(code)) return "A session code cannot contain . $ # [ ] or /";
  return null;
}

function attach(rawCode) {
  const code = String(rawCode || "").trim().toUpperCase();
  const problem = codeProblem(code);
  if (problem) { setStatus(problem, "error"); return; }

  detach();
  currentCode = code;
  currentRecords = {};
  el("code-input").value = code;
  try { localStorage.setItem("kitchenAdminLastCode", code); } catch (e) { /* private mode */ }
  document.title = `${code} — The Kitchen leaderboard`;
  setStatus(`Connecting to ${code}…`, "stale");
  renderAll();

  const path = `results/${code}`;
  unsubPath = path;
  unsub = onValue(ref(db, path), snap => {
    currentRecords = snap.exists() ? (snap.val() || {}) : {};
    const n = Object.keys(currentRecords).length;
    renderAll();
    setStatus(n
      ? `${code} · live · last change ${clockNow()}`
      : `${code} · live · no results recorded yet`);
  }, err => {
    /* The only read this page makes is one the rules allow, so this is
       unexpected — but a projected screen must say something a human can act
       on rather than nothing. */
    currentRecords = {};
    renderAll();
    setStatus(`Could not read ${code}: ${(err && err.message) ? err.message : "permission denied"}`, "error");
  });
}

/* ─── WIRING ─────────────────────────────────────────────────────────────── */
KNOWN_SESSION_CODES.forEach(code => {
  const b = document.createElement("button");
  b.className = "btn-quick";
  b.type = "button";
  b.textContent = code;
  b.addEventListener("click", () => attach(code));
  el("quick-picks-list").appendChild(b);
});

el("btn-show").addEventListener("click", () => attach(el("code-input").value));
el("code-input").addEventListener("keydown", e => { if (e.key === "Enter") attach(el("code-input").value); });
/* Refresh re-attaches rather than reloading the page, so the typed code and
   the filter survive it. The page does not need this — onValue pushes every
   change — but a facilitator watching a quiet screen deserves a way to prove
   it is alive. */
el("btn-refresh").addEventListener("click", () => { if (currentCode) attach(currentCode); });
el("only-completed").addEventListener("change", renderAll);
el("show-level1").addEventListener("change", renderAll);
el("show-midround").addEventListener("change", () => {
  if (!el("show-midround").checked) mrDetachAll();   // stop reading team records
  renderAll();
});
el("side-by-side").addEventListener("change", () => {
  document.querySelector(".boards").classList.toggle("side-by-side",
    el("side-by-side").checked);
});
document.querySelectorAll(".btn-density").forEach(b =>
  b.addEventListener("click", () => {
    setDensity(b.dataset.density);
    try { localStorage.setItem("kitchenAdminDensity", currentDensity); } catch (e) {}
  }));

/* Last code used comes back on a reload, so a page refreshed mid-session
   lands back on the session rather than on an empty box. The spacing comes
   back with it: a facilitator who set the page up for the room should not
   have to set it up again because a laptop went to sleep. */
let restored = "", storedDensity = "";
try {
  restored = localStorage.getItem("kitchenAdminLastCode") || "";
  storedDensity = localStorage.getItem("kitchenAdminDensity") || "";
} catch (e) { /* private mode */ }
setDensity(storedDensity || DEFAULT_DENSITY);
renderAll();
if (restored) attach(restored);
</script>
</body>
</html>
